name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Opens or updates the "Version packages" PR; once that PR is merged, publishes and tags the release.
      # Pinned to a commit: this step holds a token that can push to the repo, and publishes to npm through the
      # package's trusted publisher (id-token: write), with no npm token.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          pr-title: Version packages
          commit-message: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
